<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Radar — what a token would be worth, for the protocols that have none</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="hud">
  <div class="ident">
    <span class="ping" aria-hidden="true"></span>
    <span class="logotype">TOKEN<b>RADAR</b></span>
    <span class="build" id="build">radar</span>
  </div>
  <dl class="ledger" id="ledger"></dl>
  <div class="controls">
    <label class="seek">
      <span class="cap">Sieve</span>
      <input id="q" type="search" placeholder="protocol, category, chain" autocomplete="off" spellcheck="false" aria-label="Sieve the board">
    </label>
    <nav class="tabs" id="tabs" aria-label="Which board">
      <button type="button" data-view="board" class="on">Board</button>
      <button type="button" data-view="live">Already trading</button>
      <button type="button" data-view="sectors">Multiples</button>
    </nav>
  </div>
</header>

<div class="frame" id="frame">
  <aside class="filters" id="filters" aria-label="Sieve the board"></aside>

  <main class="board" id="board" tabindex="-1">
    <section class="tiles" id="tiles" aria-label="The snapshot in four numbers"></section>
    <section class="plot" id="plotwrap" aria-label="Size against implied value">
      <div class="plothd" id="plothd"></div>
      <div class="plottarget" id="plot"></div>
    </section>
    <div class="cols" id="cols"></div>
    <div class="lines" id="lines" aria-live="polite"></div>
    <div class="tail" id="tail"></div>
  </main>

  <aside class="sheet" id="sheet" aria-label="Brief"></aside>
</div>

<footer class="colophon" id="colophon"></footer>

<script src="../data.js"></script>
<script src="app.js"></script>
</body>
</html>
